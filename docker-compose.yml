services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldpulse}
      POSTGRES_USER: ${POSTGRES_USER:-worldpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldpulse}
    ports:
      - "5432:5432"
    volumes:
      - worldpulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worldpulse} -d ${POSTGRES_DB:-worldpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-worldpulse}:${POSTGRES_PASSWORD:-worldpulse}@db:5432/${POSTGRES_DB:-worldpulse}
      CORS_ORIGINS: http://localhost:3000
    command: >
      sh -c "alembic upgrade head &&
      python -m worldpulse.seed &&
      uvicorn worldpulse.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  worldpulse_postgres:
